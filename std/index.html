<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RailIn</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/webp" href="logo.webp">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
    <h2 style="font-family:'Times New Roman'">Rail-In</h2>   

    <form id="registrationForm" novalidate>

        <div class="form-group">
            <label for="firstName">Name:</label>
            <input type="text" id="firstName" placeholder="Name">
            <span class="error" id="firstNameError"></span>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="E-mail">
            <span class="error" id="emailError"></span>
        </div>

        <div class="form-group">
            <label for="password">Password:</label>
            <input type="password" id="password" placeholder="Password">
            <span class="error" id="passwordError"></span>
        </div>

        <div class="form-group">
            <label for="mobile">Mobile Number:</label>
            <input type="tel" id="mobile" placeholder="10-digit Mobile Number">
            <span class="error" id="mobileError"></span>
        </div>

        <div class="form-group">
            <label for="address">Address:</label>
            <textarea id="address" rows="4" placeholder="Address"></textarea>
            <span class="error" id="addressError"></span>
        </div>

        <button type="submit" class="submit-btn">Register</button>

    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script src="script.js"></script>

</body>
</html>
